services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nailly
      POSTGRES_PASSWORD: nailly1234
      POSTGRES_DB: nailly_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nailly -d nailly_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      PORT: ${PORT:-8080}
      GIN_MODE: release
      DATABASE_DSN: ${DATABASE_DSN:-host=db user=nailly password=nailly1234 dbname=nailly_db port=5432 sslmode=disable}
      ALLOW_ORIGIN: ${ALLOW_ORIGIN:-*}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-before-production}
      JWT_TTL_HOURS: ${JWT_TTL_HOURS:-24}
      LINE_LOGIN_CHANNEL_ID: ${LINE_LOGIN_CHANNEL_ID:?LINE_LOGIN_CHANNEL_ID is required}
      LINE_MESSAGING_CHANNEL_ACCESS_TOKEN: ${LINE_MESSAGING_CHANNEL_ACCESS_TOKEN:-}
      LINE_SHOP_OWNER_USER_ID: ${LINE_SHOP_OWNER_USER_ID:-}
      LINE_BOOKING_DETAILS_URL: ${LINE_BOOKING_DETAILS_URL:-}
      CUSTOMER_JWT_SECRET: ${CUSTOMER_JWT_SECRET:?CUSTOMER_JWT_SECRET is required}
      CUSTOMER_JWT_TTL_HOURS: ${CUSTOMER_JWT_TTL_HOURS:-720}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-nailly2025}
      ADMIN_NAME: ${ADMIN_NAME:-ผู้ดูแลระบบ}
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
